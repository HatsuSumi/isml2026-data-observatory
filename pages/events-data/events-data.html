<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/events-data/events-data.css">
</head>
<body>
    <include src="templates/header.html"></include>
    <template id="events-page-template">
        <div>
            <h1>赛事数据</h1>
            <div class="events-container"></div>
        </div>
    </template>
    <template id="event-card-template">
        <div class="event-card"></div>
    </template>
    <template id="month-section-template">
        <section class="month-section">
            <h2 class="month-title"></h2>
            <div class="events-grid"></div>
        </section>
    </template>
    <template id="date-section-template">
        <div class="date-section">
            <div class="date-header"></div>
        </div>
    </template>
    <template id="phase-section-template">
        <div class="phase-group">
            <div class="phase-header"></div>
            <div class="phase-content"></div>
        </div>
    </template>
    <template id="group-section-template">
        <div class="group-section">
            <div class="group-header">
                <div class="group-info">
                    <div class="group-title"></div>
                    <div class="group-date"></div>
                </div>
                <div class="status-info"></div>
            </div>
            <div class="cards-container"></div>
        </div>
    </template>
    <template id="elevator-nav-template">
        <nav class="elevator-nav">
            <ul class="elevator-nav-list"></ul>
        </nav>
    </template>
    <template id="elevator-nav-group-template">
        <div class="elevator-nav-group">
            <div class="elevator-nav-item">
                <span class="nav-label"></span>
                <button class="collapse-toggle" type="button">
                    <i class="fas fa-chevron-down collapse-icon"></i>
                </button>
            </div>
            <div class="nav-sub-items"></div>
        </div>
    </template>
    <template id="event-card-body-template">
        <div class="event-card-body">
            <div class="event-header">
                <div class="event-info">
                    <div class="event-title"></div>
                </div>
            </div>
            <div class="event-content"></div>
            <div class="top-characters">
                <h4 class="top-title">得票数 Top 5</h4>
                <div class="character-list"></div>
            </div>
            <div class="event-footer"></div>
        </div>
    </template>
    <template id="top-character-item-template">
        <div class="character-item">
            <div class="character-avatar">
                <img alt="">
            </div>
            <span class="rank"></span>
            <span class="name"></span>
            <span class="votes"></span>
            <div class="votes-diff"></div>
        </div>
    </template>
    <template id="info-row-template">
        <div>
            <span class="key"></span>
            <span class="value"></span>
        </div>
    </template>
    <template id="postpone-hint-template">
        <div class="postpone-hint" title="该赛事已延期">?</div>
    </template>
    <div class="container"></div>
    <include src="templates/footer.html"></include>
    <script type="module" src="js/common/template-loader.js"></script>
    <script type="module" src="js/events-data/events-data.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        if (sessionStorage.getItem('return_from_event')) {
            history.scrollRestoration = 'manual';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
