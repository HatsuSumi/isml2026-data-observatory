<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../../">
    <link rel="stylesheet" href="css/schedule/schedule/schedule.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <include src="templates/header.html"></include>
    <div id="danmaku-container" class="animation-container"></div>
    <div class="site-wrapper">
        <div class="schedule-container">
            <h1 class="schedule-title">ISML 2026 赛事日程</h1>
            
            <div class="search-container">
                <div class="character-search">
                    <input type="text" id="characterSearch" placeholder="输入角色名称查看参赛历史...">
                </div>
                <div class="no-character" hidden></div>
            </div>
            
            <div id="characterHistory" class="character-history" style="display: none;">
                <h2 class="character-name"></h2>
                <div class="match-list"></div>
            </div>
            
            <div id="timeline" class="timeline"></div>
        </div>
        <template id="schedule-elevator-nav-template">
            <nav class="elevator-nav">
                <div class="elevator-search">
                    <input type="text" placeholder="搜索赛事...多个搜索结果可用回车键切换" />
                    <div class="search-info"></div>
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">全部赛事</button>
                    <button class="filter-btn" data-filter="ongoing">进行中</button>
                    <button class="filter-btn" data-filter="completed">已结束</button>
                    <button class="filter-btn" data-filter="upcoming">未开始</button>
                    <div class="date-filter">
                        <div class="date-filter-slot" data-filter-slot="start"></div>
                        <div class="date-filter-slot" data-filter-slot="end"></div>
                    </div>
                </div>
                <ul class="elevator-nav-list"></ul>
            </nav>
        </template>
        <template id="schedule-nav-item-template">
            <li>
                <a href="#" class="nav-link">
                    <span class="status-dot"></span>
                    <div class="nav-text">
                        <div class="nav-text-content">
                            <span class="phase-title"></span>
                            <span class="phase-status phase-status-toggle"></span>
                        </div>
                        <span class="nav-arrow">›</span>
                    </div>
                    <div class="round-dropdown"></div>
                </a>
            </li>
        </template>
        <template id="schedule-round-item-template">
            <div class="round-item" data-match-title="">
                <span class="round-title"></span>
                <span class="round-status"></span>
            </div>
        </template>
        <template id="schedule-custom-select-template">
            <div class="select-wrapper custom-select">
                <button
                    type="button"
                    class="custom-select-trigger"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                >
                    <span class="custom-select-label"></span>
                </button>
                <div class="custom-select-menu" role="listbox"></div>
            </div>
        </template>
        <template id="schedule-custom-select-option-template">
            <button type="button" class="custom-select-option" role="option" aria-selected="false"></button>
        </template>
        <template id="schedule-no-results-template">
            <div class="no-results">没有找到符合条件的赛事</div>
        </template>
        <template id="schedule-current-match-template">
            <div class="current-match-info">
                <div class="info-label"></div>
                <div class="match-name"></div>
            </div>
        </template>
        <template id="schedule-character-selection-template">
            <div class="character-selection">
                <p class="character-selection-title">匹配到多个角色，请选择：</p>
            </div>
        </template>
        <template id="schedule-character-selection-item-template">
            <button type="button" class="character-selection-item">
                <div class="avatar" hidden>
                    <img alt="">
                </div>
                <div class="info"></div>
            </button>
        </template>
        <template id="schedule-tooltip-template">
            <div class="tooltip"></div>
        </template>
        <template id="schedule-timeline-section-template">
            <div class="timeline-section">
                <div class="timeline-header">
                    <h2></h2>
                </div>
            </div>
        </template>
        <template id="schedule-timeline-item-template">
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="match-card">
                        <div class="match-date"></div>
                        <h3 class="match-title"></h3>
                        <div class="match-header">
                            <div class="match-status"></div>
                            <div class="match-stats"></div>
                        </div>
                        <div class="match-details"></div>
                    </div>
                </div>
            </div>
        </template>
        <template id="schedule-inline-text-template">
            <span></span>
        </template>
        <template id="schedule-paragraph-template">
            <p></p>
        </template>
        <template id="schedule-line-break-template">
            <br>
        </template>
        <template id="schedule-voting-format-wrapper-template">
            <div class="voting-format-wrapper">
                <span class="key"></span>
                <div class="voting-format-menu"></div>
            </div>
        </template>
        <template id="schedule-format-item-template">
            <div class="format-item"></div>
        </template>
        <template id="schedule-status-wrapper-template">
            <div class="status-wrapper">
                <span class="status-icon"></span>
                <div class="postpone-hint">
                    <i class="fas fa-question-circle"></i>
                    <div class="tooltip"></div>
                </div>
            </div>
        </template>
        <template id="schedule-stats-item-template">
            <span class="stats-item"></span>
        </template>
        <template id="schedule-detail-row-template">
            <p>
                <span class="key"></span>
                <span class="value"></span>
            </p>
        </template>
        <template id="schedule-countdown-template">
            <span data-countdown="">计算中...</span>
        </template>
        <template id="schedule-result-links-wrapper-template">
            <div class="result-links-wrapper">
                <div class="result-links-trigger"></div>
                <div class="result-links-menu"></div>
            </div>
        </template>
        <template id="schedule-result-link-template">
            <a></a>
        </template>
        <template id="schedule-reminder-button-template">
            <div class="match-link reminder-btn"></div>
        </template>
        <include src="templates/footer.html"></include>
    </div>
    
    <script type="module" src="js/common/template-loader.js"></script>
    <script type="module" src="js/schedule/schedule.js"></script>
    <script>
        if (sessionStorage.getItem('schedule_scroll_position')) {
            history.scrollRestoration = 'manual';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
