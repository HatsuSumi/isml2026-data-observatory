<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <script type="module">
        import { NOMINATION_TABLE_CONFIGS } from '/js/table/nomination-table-config.js';

        const headParams = new URLSearchParams(window.location.search);
        const headTableId = headParams.get('id');
        const headTableConfig = headTableId ? NOMINATION_TABLE_CONFIGS[headTableId] : null;

        const baseStyleLink = document.createElement('link');
        baseStyleLink.rel = 'stylesheet';
        baseStyleLink.href = 'css/tables/nomination-table-base.css';
        document.head.appendChild(baseStyleLink);

        if (!headTableConfig) {
            document.title = '提名表格 - ISML 2026 数据观测';
        } else {
            document.title = `${headTableConfig.title} - ISML 2026 数据观测`;

            const styleLink = document.createElement('link');
            styleLink.rel = 'stylesheet';
            styleLink.href = `css/tables/${headTableConfig.tableStyle}.css`;
            document.head.appendChild(styleLink);
        }
    </script>
</head>
<body>
    <include src="templates/header.html"></include>
    <div class="container">
        <h1 id="pageTitle">提名表格</h1>
        <div class="subtitle">点击表头可对数据进行排序</div>
        <div class="subtitle" id="pageSubtitle"></div>
        <div class="filter-container">
            <div class="select-wrapper">
                <select id="searchType" class="search-type" aria-label="筛选类型">
                    <option value="none">不筛选</option>
                    <option value="rank">按排名筛选</option>
                    <option value="character">按角色筛选</option>
                    <option value="anime">按IP筛选</option>
                    <option value="cv">按声优筛选</option>
                    <option value="votes">按票数筛选</option>
                </select>
            </div>
            <input type="text" id="searchInput" placeholder="请输入筛选内容..." class="search-input">
            <div id="votesRange" class="votes-range" style="display: none;">
                <input type="number" id="minVotes" placeholder="最小票数" class="vote-input">
                <span class="range-separator">-</span>
                <input type="number" id="maxVotes" placeholder="最大票数" class="vote-input">
            </div>
            <div class="select-wrapper">
                <select id="statusFilter" class="status-filter" aria-label="状态筛选"></select>
            </div>
            <button class="reset-btn">
                <i class="fas fa-undo"></i>
                恢复初始状态
            </button>
        </div>
        <div class="button-container">
            <a href="javascript:history.back()" class="home-btn">返回上一页</a>
            <a id="visualizationLink" class="visualization-btn">数据可视化</a>
            <div class="dropdown">
                <button class="download-btn" onclick="toggleDropdown()">下载表格</button>
                <div id="downloadDropdown" class="dropdown-content">
                    <a href="#" onclick="downloadFile('csv', event)">下载原始CSV</a>
                    <a href="#" onclick="downloadFile('xlsx', event)">下载原始XLSX</a>
                    <a href="#" onclick="downloadFile('json', event)">下载原始JSON</a>
                    <a href="#" onclick="downloadCurrentTable('csv', event)">下载筛选后的CSV</a>
                    <a href="#" onclick="downloadCurrentTable('xlsx', event)">下载筛选后的XLSX</a>
                    <a href="#" onclick="downloadCurrentTable('json', event)">下载筛选后的JSON</a>
                </div>
            </div>
        </div>
        <template id="nomination-row-template">
            <tr>
                <td class="rank"></td>
                <td></td>
                <td></td>
                <td><img width="50" alt=""></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="votes"></td>
            </tr>
        </template>
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>日期</th>
                    <th>赛事名称</th>
                    <th>头像</th>
                    <th>角色</th>
                    <th>IP</th>
                    <th>CV</th>
                    <th>得票数</th>
                </tr>
            </thead>
            <tbody id="tableBody" style="position: relative;"></tbody>
        </table>
        <button class="back-to-top">↑</button>
    </div>
    <include src="templates/footer.html"></include>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script type="module" src="js/common/template-loader.js"></script>
    <script type="module" src="js/common/event-links.js"></script>
    <script type="module">
        import { NOMINATION_TABLE_CONFIGS } from '/js/table/nomination-table-config.js';
        import { initNominationTable } from '/js/table/nomination-table-core.js';

        const pageParams = new URLSearchParams(window.location.search);
        const pageTableId = pageParams.get('id');
        const pageTableConfig = pageTableId ? NOMINATION_TABLE_CONFIGS[pageTableId] : null;

        if (!pageTableConfig) {
            document.getElementById('pageSubtitle').textContent = '缺少或无效的提名表 id 参数';
        } else {
            document.getElementById('pageTitle').textContent = pageTableConfig.title;
            document.getElementById('pageSubtitle').textContent = pageTableConfig.subtitle;
            document.getElementById('visualizationLink').href = `pages/visualization/visualization.html?id=${pageTableConfig.visualizationId}`;
            document.getElementById('statusFilter').innerHTML = pageTableConfig.mode === 'stellar'
                ? `
                    <option value="all">全部选手</option>
                    <option value="promoted">晋级选手</option>
                    <option value="not_promoted">未晋级选手</option>
                    <option value="normal">普通选手</option>
                    <option value="auto">自动晋级</option>
                `
                : `
                    <option value="all">全部选手</option>
                    <option value="advance">已晋级</option>
                    <option value="eliminate">未晋级</option>
                `;

            await initNominationTable(pageTableConfig);
        }
    </script>
</body>
</html>
